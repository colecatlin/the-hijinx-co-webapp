    <link rel="manifest" href="/manifest.json" />
    <title>Hijinx — Motorsports, Culture & Competition</title>
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var apply = function (theme) {
            el.classList.remove('theme-light', 'theme-dark');
            el.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
          };
          var stored = localStorage.getItem('hijinx-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          apply(stored ? stored : (prefersDark ? 'dark' : 'light'));
          // Sync with OS theme changes dynamically when no explicit choice is stored
          if (window.matchMedia) {
            var mq = window.matchMedia('(prefers-color-scheme: dark)');
            var handler = function (e) {
              if (!localStorage.getItem('hijinx-theme')) apply(e.matches ? 'dark' : 'light');
            };
            if (mq.addEventListener) mq.addEventListener('change', handler);
            else if (mq.addListener) mq.addListener(handler);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      // Frame-busting defense-in-depth (CSP frame-ancestors is primary protection)
      if (window.top !== window.self) {
        try { window.top.location = window.self.location; } catch (e) {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
