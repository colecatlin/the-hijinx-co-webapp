      (function () {
        try {
          var t = localStorage.getItem('hijinx-theme') || 'light';
          var el = document.documentElement;
          el.classList.remove('theme-light', 'theme-dark');
          el.classList.add(t === 'dark' ? 'theme-dark' : 'theme-light');
        } catch (e) {}
